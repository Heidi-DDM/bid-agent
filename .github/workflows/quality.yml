name: quality

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m pytest runtime/tests -v
      - run: python -m py_compile scripts/matching/*.py
      - run: python -m py_compile scripts/approval/*.py
      - run: python -m py_compile runtime/core/*.py runtime/db/*.py runtime/db/alembic/*.py runtime/db/alembic/versions/*.py runtime/*.py
      - run: python scripts/matching/run_golden_lab.py