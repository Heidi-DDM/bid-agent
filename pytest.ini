# pytest 配置（R019）
# integration 标记：需要真实 PostgreSQL 的集成测试。
# rag 标记：RAG 运行时（R025/F025）测试子集，`-m rag` 单独执行（docs/07 方案 §10.2）。
# CI 默认执行 `-m "not integration"`（见 .github/workflows/quality.yml）；
# 本地执行需先设置 DATABASE_URL 并完成 alembic 迁移（见 runtime/README.md §7）。
[pytest]
markers =
    integration: 需要真实 PostgreSQL 的集成测试（设置 DATABASE_URL 后本地执行）
    rag: R025/F025 RAG 运行时测试（三层知识库、检索、核验、匹配接入）
    auth: 认证与授权测试
