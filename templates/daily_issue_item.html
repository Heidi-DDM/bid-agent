<div class="item" id="$anchor">
  <div class="item-head">
    <span class="type-badge">$announcement_type</span>
    <span class="urgency $urgency_class">$urgency_label</span>
  </div>
  <a class="name" href="$detail_url">$project_name</a>
  <div class="grid">
    $row_tenderee
    $row_region
    $row_publish_time
    $row_deadline_signup
    $row_deadline_bid
    $row_amount
  </div>
  <div class="actions">
    <a class="btn primary" href="$source_url" target="_blank" rel="noopener">查看原文公告</a>
    <a class="btn ghost" href="$detail_url">项目详情</a>
  </div>
</div>
