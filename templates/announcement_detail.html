<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>$title</title>
<style>
  :root{--brand:#1a56a8;--bg:#f5f6f8;--card:#fff;--text:#1f2329;--sub:#646a73;--line:#e5e6eb}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:12px 12px 32px}
  .nav{font-size:13px;color:var(--sub);margin-bottom:10px}
  .nav a{color:var(--brand);text-decoration:none}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card h1{font-size:18px;line-height:1.4;word-break:break-all;margin-bottom:8px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{font-size:12px;padding:2px 8px;border-radius:4px;background:#eef2fb;color:var(--brand)}
  .badge.warn{background:#fff4e5;color:#b45309}
  h2{font-size:15px;color:var(--brand);margin:4px 0 8px}
  .kv{border-top:1px solid var(--line);padding:8px 0;font-size:14px;display:flex;flex-wrap:wrap}
  .kv .k{width:118px;flex-shrink:0;color:var(--sub)}
  .kv .v{flex:1;min-width:0;word-break:break-all}
  .kv .v a{color:var(--brand);word-break:break-all}
  .src-note{background:#f7f9fc;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--sub)}
  .back{display:inline-block;margin-top:14px;color:var(--brand);text-decoration:none;font-size:14px;
        padding:11px 0;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="$archive_url">← 返回日报</a></div>
  <div class="card">
    <h1>$title</h1>
    <div class="badges">
      <span class="badge">$announcement_type</span>
      <span class="badge">$region</span>
      $urgency_badge
    </div>
    $kv_rows
    $tender_doc_rows
    <div class="src-note">
      信息来源：$source_platform<br>
      原文发布时间：$publish_time<br>
      <a href="$source_url" target="_blank" rel="noopener">查看公告原文 →</a>
    </div>
    $backup_links
    $related_events
  </div>
  <a class="back" href="$archive_url">← 返回日报</a>
</div>
</body>
</html>
