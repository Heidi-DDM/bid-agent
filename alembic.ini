# Alembic 迁移配置（R018/F018）
# 数据库连接串从环境变量 DATABASE_URL 读取（runtime/db/alembic/env.py），
# 不在本文件保存任何真实凭据。
[alembic]
script_location = runtime/db/alembic
prepend_sys_path = .
# 迁移只操作 analysis_jobs 表（当前 R018 范围）；后续 R019 在独立迁移中追加
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S