# 演示环境统一入口（docs/11 §3）：静态原型页 + /api、/healthz、/readyz 反代到 api 容器
server {
    listen 80;
    server_name _;

    # 招标文件上传上限（F020 multipart）
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # 进程级健康端点（前端探测 /healthz 判断服务存在）
    location = /healthz { proxy_pass http://api:8000/healthz; }
    location = /readyz  { proxy_pass http://api:8000/readyz; }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # 联网搜索/解析触发可能耗时较长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # 静态页不缓存：sync.sh 更新前端后刷新即生效
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
