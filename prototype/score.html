<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评分分析｜投标智能体</title>
  <link rel="stylesheet" href="styles.css?v=20260929d">
</head>
<body>
  <header class="topbar"></header>

  <div class="layout">
    <div class="main">
      <div class="steps"></div>
      <div id="api-error" style="display:none"></div>

      <div class="state-banner" id="state-banner" style="display:none"></div>

      <section class="card">
        <div class="card-title-row">
          <h2>评分分析 — <span id="proj-name">加载中…</span></h2>
          <span class="hint">评分项按「可操作性」五类分组（ADR-008 §2.5）；系统不生成、推荐或假定报价（docs/12 §2.3）。</span>
        </div>
        <div id="run-context" class="run-context"></div>
        <div id="hist-banner"></div>
        <div id="score-summary" style="margin:10px 0"></div>
        <div id="score-groups" class="score-groups"></div>
      </section>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
        <a class="btn" href="matrix.html">← 当前结论（资格与资源）</a>
        <a class="btn ghost" href="operations.html">投标执行计划 →</a>
        <a class="btn ghost" href="queue.html">待确认与处置 →</a>
        <a class="btn ghost" href="approval.html">审批页（仅满分显示操作）</a>
      </div>
    </div>
  </div>

  <!-- 原文定位弹层（与矩阵页同一契约：Bearer 拉 blob 后 iframe 内嵌，附 #page=N） -->
  <div class="source-modal" id="source-modal" style="display:none">
    <div class="source-modal-box">
      <div class="source-modal-head">
        <b>招标文件原文</b>
        <span id="source-modal-meta" class="hint"></span>
        <button type="button" class="btn ghost" id="source-modal-close">关闭</button>
      </div>
      <iframe id="source-modal-frame" class="source-modal-frame" title="招标文件原文"></iframe>
    </div>
  </div>

  <footer class="footer">
    <span>某建设集团 · 投标智能体 — 评分分析页（ADR-008 / docs/12 §2.3）</span>
    <span>数据均为脱敏演示数据，不代表真实业务</span>
  </footer>

  <script src="data.js?v=20260929d"></script>
  <script src="api.js?v=20260929d"></script>
  <script src="common.js?v=20260929d"></script>
  <script>
    initPage("score.html", "score");
    const PJ0 = apiProjectId();
    const PJ = () => PJ0.id;
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

    async function loadScore() {
      const errBox = document.getElementById("api-error");
      try {
        const [sa, adm, proj] = await Promise.allSettled([
          apiScoringAnalysis(PJ()),
          apiGet(`/projects/${PJ()}/admission`),
          apiGet(`/projects/${PJ()}`),
        ]);
        document.getElementById("proj-name").textContent =
          proj.status === "fulfilled" ? proj.value.project_name : PJ();
        if (sa.status === "rejected") {
          if (sa.reason && sa.reason.status === 404) {
            errBox.innerHTML = `<div class="notice error">评分分析接口不存在（404）：本机 API 进程仍是旧版本——请重启 API 与 worker（bash scripts/setup_local_env.sh stop && start）后刷新本页。</div>`;
            errBox.style.display = "block";
            return;
          }
          throw sa.reason;
        }
        const data = sa.value;
        const a = adm.status === "fulfilled" ? (adm.value.admission || {}) : {};
        document.getElementById("proj-name").insertAdjacentHTML("afterend", apiProjectChip(PJ0));

        /* 状态横幅（准入摘要仍来自 /admission；无可算评分时不再显示「未满分」） */
        const banner = document.getElementById("state-banner");
        banner.style.display = "flex";
        const state = a.state || "collecting";
        const calculable = data.summary && data.summary.calculable;
        const bTone = a.eligible ? ["ok", "内部满分——可进入人工审批"]
          : (state === "blocked_hard_requirement" || state === "not_qualified" ? ["danger", "存在硬性不满足项（一票否决）"]
          : (calculable === false ? ["info", "当前无可自动计算评分项——不能自动判断是否达到内部满分"]
          : (state === "blocked_missing_data" ? ["warn", "存在缺证阻断项——补录核验后重算"] : ["info", "评分与准入状态随匹配结果更新"])));
        banner.innerHTML = `<span class="badge ${bTone[0]}">${esc(bTone[1].split("——")[0])}</span>
          <div><span class="state-name">${esc(name)}</span>
          <span class="state-desc">— ${esc(bTone[1])}</span></div>`;

        /* 运行上下文条（与矩阵页同一 run） */
        const rc = data.run_context || {};
        const when = data.generated_at ? String(data.generated_at).slice(0, 16).replace("T", " ") : "—";
        document.getElementById("run-context").innerHTML = [
          `<span class="rc-item">运行 <b>${esc(rc.run_id || "尚无")}</b></span>`,
          `<span class="rc-item">规则集 <b>${esc(rc.ruleset_version || "—")}</b></span>`,
          `<span class="rc-item">判定时点 <b>${esc(data.as_of || "—")}</b></span>`,
          `<span class="rc-item">生成时间 <b>${esc(when)}</b></span>`,
        ].join("") + ((data.result_freshness === "stale" || data.is_current === false)
          ? `<span class="rc-stale"><span class="badge warn">已过期（stale）</span></span>` : "");
        document.getElementById("hist-banner").innerHTML = data.historical_sample
          ? `<div class="hist-banner"><span class="hist-tag">${esc(data.historical_sample_banner)}</span>
              <div>${esc(data.historical_sample_note || "")}</div></div>` : "";

        /* 摘要：可自动计算 X 项 · 待内部评审 Y 项 · 待结构化 Z 项（X=0 时不显示 0/0） */
        const s = data.summary || {};
        let sumHtml = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <span class="badge ok">可自动计算 ${s.objective_count ?? 0} 项</span>
          <span class="badge review">待内部质量评审 ${s.subjective_count ?? 0} 项</span>
          <span class="badge info">报价计算规则 ${s.price_formula_count ?? 0} 项</span>
          <span class="badge gray">评标方法说明 ${s.methodology_count ?? 0} 项（不计分）</span>
          <span class="badge warn">待结构化 ${s.unstructured_count ?? 0} 项</span>
        </div>`;
        if (s.calculable && (s.objective_score != null || s.objective_max != null)) {
          sumHtml += `<div class="hint" style="margin-top:6px">可复算客观分：<b>${esc(s.objective_score ?? "—")} / ${esc(s.objective_max ?? "—")}</b>
            ${s.internal_full_score_ready === true ? '<span class="badge ok">达到内部满分条件</span>'
              : s.internal_full_score_ready === false ? '<span class="badge warn">未达到内部满分条件</span>' : ""}</div>`;
        } else {
          sumHtml += `<div class="notice warn" style="margin-top:8px"><b>当前无可自动计算评分项，不能自动判断是否达到内部满分</b>。
            原因见各分组（评分规则待结构化 / 授权输入未录入 / 计分证据缺失）——<b>不显示「0/0」或「未满分」</b>（docs/12 §2.3）。</div>`;
        }
        document.getElementById("score-summary").innerHTML = sumHtml;

        /* 五类分组 */
        const toneOf = { objective_calculable: "ok", subjective_review: "review", price_formula: "info",
                         methodology_only: "gray", unstructured: "warn" };
        const groups = data.groups || [];
        document.getElementById("score-groups").innerHTML = groups.length ? groups.map((g) => `
          <div class="score-group">
            <div class="sg-head"><span class="badge ${toneOf[g.classification] || "gray"}">${esc(g.label)}</span>
              <span class="n">${g.items.length} 项</span></div>
            <table class="tbl"><tbody>
              ${g.items.map((it, i) => `
                <tr class="row-${toneOf[g.classification] || "gray"}">
                  <td class="num" style="width:70px"><b>第 ${i + 1} 项</b></td>
                  <td>${esc((it.assertion || "").slice(0, 140))}${(it.assertion || "").length > 140 ? "…" : ""}
                    <div class="req-src">条款 ${fmtClause(it.clause_ref) || "—"}${it.page_no != null ? ` · ${apiSourcePageLink(it.source_link, it.page_no, "原文第 " + it.page_no + " 页")}` : (it.source_link ? ` · ${apiSourcePageLink(it.source_link, null)}` : "")}</div></td>
                  <td style="width:120px">${apiResultStateBadge(it.projected_result, it.state_label)}${it.reason_code ? `<div style="margin-top:4px">${apiReasonCodeBadge(it.reason_code)}</div>` : ""}</td>
                  <td style="width:240px;color:var(--ink-2)">${esc((it.reason || "—").slice(0, 150))}</td>
                  ${g.classification === "objective_calculable" || g.classification === "price_formula"
                    ? `<td class="num" style="width:90px">${it.score != null ? `<b>${esc(it.score)}</b> / ${esc(it.max_score ?? "—")}` : "待复算"}</td>` : ""}
                </tr>`).join("")}
            </tbody></table>
          </div>`).join("")
          : `<div class="hint">本项目的招标文件尚未解析出评分项（或评分候选仍在解析质量区待处置）。</div>`;
      } catch (err) {
        if (err.status === 403) { errBox.innerHTML = `<div class="notice error">权限不足：当前角色「${apiRoleLabel()}」无权查看结果。</div>`; errBox.style.display = "block"; return; }
        if (err.status === 401) { errBox.innerHTML = `<div class="notice error">未登录：请用右上角账号登录。</div>`; errBox.style.display = "block"; return; }
        errBox.innerHTML = `<div class="notice error">加载评分分析失败：${esc(err.message)}</div>`; errBox.style.display = "block";
      }
    }

    try { loadScore(); } catch (e) {
      const box = document.getElementById("api-error");
      if (box) { box.innerHTML = '<div class="notice error">页面初始化失败：' + esc(e && e.message || e) +
        '。多为浏览器缓存了旧版脚本——请强制刷新（Mac：Cmd+Shift+R / Windows：Ctrl+F5）。</div>'; box.style.display = "block"; }
    }
  </script>
</body>
</html>
