<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解析与自动匹配｜投标智能体原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"></header>

  <div class="layout">
    <div class="main">
      <div class="steps"></div>

      <section class="card">
        <div class="card-title-row">
          <h2>解析与自动匹配 — <span id="proj-name">加载中…</span></h2>
          <span class="hint">解析确认后自动执行一次（只读展示，GET 不触发匹配）；企业资料来自已解析且已核验的资料库，不在此页重新选择。</span>
        </div>

        <div class="tabs" id="tabs">
          <button class="tab active" data-t="hard_requirement">硬性要求（…）</button>
          <button class="tab" data-t="scored_requirement">评分项（…）</button>
          <button class="tab" data-t="action_requirement">动作项（…）</button>
        </div>

        <div id="run-summary" class="hint" style="margin:8px 0"></div>
        <div id="matrix-table"></div>

        <div class="notice" style="margin-top:12px">
          <b>自动匹配口径（F008 §6.3 / ADR-001 §2.3）</b>：
          <span class="badge ok">满足</span> 证据充分且符合要求；
          <span class="badge warn">待补/不可判定</span> 关键证据缺失，默认阻断，不推断满足；
          <span class="badge review">人工复核</span> 解析不完整或主观项待内部评审；
          <span class="badge danger">不满足</span> 证据充分但明确不符合 → 一票否决。
          每一条结论均可回链条款与证据。
        </div>
        <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <a class="btn" href="score.html">查看风险与缺失 →</a>
          <a class="btn ghost" href="import.html">← 返回文件解析</a>
        </div>
      </section>
    </div>
  </div>

  <footer class="footer">
    <span>某建设集团 · 投标智能体 — 可点击原型 v0.1.0（Iteration 2 / R011）</span>
    <span>数据均为脱敏演示数据，不代表真实业务</span>
  </footer>

  <div class="drawer-mask" id="drawer-mask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h3 id="drawer-title" style="margin:0"></h3>
      <button class="close" id="drawer-close">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    initPage("matrix.html", "matrix");
    const PJ0 = apiProjectId();
    const PJ = () => PJ0.id;
    document.getElementById("proj-name").insertAdjacentHTML("afterend", apiProjectChip(PJ0));

    function matchBadge(m) {
      const map = {
        satisfied: ["ok", "满足"], passed: ["ok", "满足"],
        unverifiable: ["warn", "待补/不可判定"], blocked_missing_data: ["warn", "缺证阻断"],
        manual_review: ["review", "人工复核"],
        failed: ["danger", "不满足"], not_qualified: ["danger", "不满足"], blocked_hard_requirement: ["danger", "硬性不满足"],
      };
      const mm = map[m] || ["gray", m || "未判定"];
      return `<span class="badge ${mm[0]}">${mm[1]}</span>`;
    }

    let REQUIREMENTS = [];
    let RUN = null;

    async function loadMatrix() {
      const box = document.getElementById("matrix-table");
      const apiError = (msg) => { box.innerHTML = `<div class="notice error">${msg}</div>`; };
      try {
        const data = await apiGet(`/projects/${PJ()}/matrix`);
        REQUIREMENTS = data.requirements || [];
        RUN = data.run || null;
        const proj = await apiGet(`/projects/${PJ()}`).catch(() => null);
        if (proj) document.getElementById("proj-name").textContent = proj.project_name;
        // tab 计数 + run 摘要
        const counts = {};
        REQUIREMENTS.forEach((r) => { counts[r.req_type] = (counts[r.req_type] || 0) + 1; });
        document.querySelectorAll("#tabs .tab").forEach((t) => {
          const n = counts[t.dataset.t] || 0;
          const label = { hard_requirement: "硬性要求", scored_requirement: "评分项", action_requirement: "动作项" }[t.dataset.t];
          t.textContent = `${label}（${n}）`;
        });
        document.getElementById("run-summary").innerHTML =
          (RUN && RUN.run_id
            ? `最近匹配运行：<code>${RUN.run_id}</code> · 规则集 ${RUN.rule_set_id || "—"} · as_of ${RUN.as_of || "—"} · 模式 ${RUN.mode || "—"} · coverage ${JSON.stringify(RUN.coverage || "")}`
            : `<span class="badge warn">尚无匹配运行</span>——解析候选经人工复核确认写入规则集后，系统才会自动触发匹配；当前看到的是要求本身，不是匹配结论。`)
          + (REQUIREMENTS.length && !RUN?.run_id ? ` <span class="hint">本项目规则集已确认但匹配尚未运行/排队中，稍后刷新。</span>` : "");
        if (!REQUIREMENTS.length) { apiError("暂无要求（规则集未建立或项目无解析确认）——请到「选择与解析 / 复核与补录」完成解析确认。"); return; }
        renderMatrix("hard_requirement");
      } catch (err) {
        if (err.status === 403) { apiError(`权限不足：当前角色 ${apiRole() || "未登录"} 无权查看结果（需 result read）。`); return; }
        if (err.status === 401) { apiError("未登录：请用右上角账号登录（投标专员 toubiao / 经营负责人 jingying，密码 123456）。"); return; }
        apiError("加载矩阵失败：" + err.message);
      }
    }

    function renderMatrix(type) {
      const rows = REQUIREMENTS.filter((r) => r.req_type === type);
      const sum = { total: rows.length, ok: 0, warn: 0, review: 0, danger: 0 };
      rows.forEach((r) => {
        const m = r.match || "unverifiable";
        if (["satisfied", "passed"].includes(m)) sum.ok++;
        else if (m === "manual_review") sum.review++;
        else if (["failed", "not_qualified", "blocked_hard_requirement"].includes(m)) sum.danger++;
        else sum.warn++;
      });
      const box = document.getElementById("matrix-table");
      box.innerHTML = `
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <span class="badge gray">共 ${sum.total} 项</span>
          <span class="badge ok">满足 ${sum.ok}</span>
          ${sum.warn ? `<span class="badge warn">待补/阻断 ${sum.warn}</span>` : ""}
          ${sum.review ? `<span class="badge review">人工复核 ${sum.review}</span>` : ""}
          ${sum.danger ? `<span class="badge danger">不满足 ${sum.danger}</span>` : ""}
        </div>
        <table class="tbl">
          <thead>
            <tr>
              <th style="width:90px">编号</th>
              <th>招标要求（原文摘录）</th>
              <th style="width:120px">条款</th>
              <th style="width:130px">匹配结论</th>
              <th style="width:240px">判定说明</th>
              ${type === "scored_requirement" ? '<th style="width:110px">满分值</th>' : ""}
            </tr>
          </thead>
          <tbody>
            ${rows.map((r) => `
              <tr class="clickable" data-req="${r.requirement_id}">
                <td class="num"><b>${r.requirement_id}</b></td>
                <td>${(r.assertion || "").slice(0, 180)}${(r.assertion || "").length > 180 ? "…" : ""}</td>
                <td>${fmtClause(r.clause_ref)}</td>
                <td>${matchBadge(r.match)}</td>
                <td style="color:var(--ink-2)">${(r.match_reason && r.match_reason.text) || JSON.stringify(r.match_reason || "") || "—"}</td>
                ${type === "scored_requirement" ? `<td class="num">${r.max_score ?? "—"}${r.score != null ? `（可复算 <b>${r.score}</b>）` : ""}</td>` : ""}
              </tr>`).join("")}
          </tbody>
        </table>`;
      box.querySelectorAll("tr.clickable").forEach((tr) => {
        tr.addEventListener("click", () => {
          const req = REQUIREMENTS.find((r) => r.requirement_id === tr.dataset.req);
          if (req) openReqDetail(req);
        });
      });
    }

    function openReqDetail(r) {
      const mask = document.getElementById("drawer-mask");
      const drawer = document.getElementById("drawer");
      document.getElementById("drawer-title").textContent = `${r.requirement_id} · ${r.category || ""}`;
      document.getElementById("drawer-body").innerHTML = `
        <div class="notice info" style="margin-top:0"><b>条款引用</b>：${fmtClause(r.clause_ref)}</div>
        <h3 style="margin-top:6px">招标要求原文</h3>
        <div class="quote">${r.assertion || "—"}</div>
        <h3>匹配结论</h3>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${matchBadge(r.match)}
          <span style="font-size:13px;color:var(--ink-2)">${(r.match_reason && r.match_reason.text) || "—"}</span>
        </div>
        ${r.max_score != null ? `<div style="margin-top:6px;font-size:13px;color:var(--ink-2)">满分值：<b>${r.max_score}</b>${r.score != null ? ` ｜ 可复算得分：<b>${r.score}</b>` : ""}</div>` : ""}
        <h3>证据引用（evidence_refs）</h3>
        ${(r.evidence || []).length ? r.evidence.map((e) => `<div class="hint"><code>${e}</code></div>`).join("") : '<div class="hint">无企业证据引用——动作类要求以动作状态为准，或证据缺失默认阻断。</div>'}
        <h3>溯源要求（F003/ADR-001）</h3>
        <div class="hint">每条结论回链招标条款（clause_ref）与企业证据（evidence_ref）；缺失字段一律标注“待补/待核实”，禁止编造。</div>`;
      mask.classList.add("open");
      drawer.classList.add("open");
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      renderMatrix(btn.dataset.t);
    });

    loadMatrix();
  </script>
</body>
</html>
